# P3: Local full-stack parity with production topology.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local!SqlPwd123"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Local!SqlPwd123' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  api:
    build:
      context: ../../..
      dockerfile: Phase6-Full-Stack-Integration/12-CICD-Docker-Deployment/PracticeProblemsSolutions/Dockerfile.api
    depends_on:
      sqlserver: { condition: service_healthy }
      redis:     { condition: service_healthy }
      mailpit:   { condition: service_started }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=taskflow;User Id=sa;Password=Local!SqlPwd123;TrustServerCertificate=true"
      ConnectionStrings__Redis: "redis:6379"
      Email__Smtp__Host: "mailpit"
      Email__Smtp__Port: "1025"
    ports: ["8080:8080"]

  web:
    build:
      context: ../../../web
      dockerfile: ../Phase6-Full-Stack-Integration/12-CICD-Docker-Deployment/PracticeProblemsSolutions/Dockerfile.web
      args:
        VITE_API_BASE_URL: "http://localhost:8080/api/v1"
    ports: ["5173:8080"]
    depends_on:
      api: { condition: service_started }

volumes:
  mssql-data:
