# P4: CI — API + Web + E2E in parallel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test.trx" --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: '**/TestResults/*.trx'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - run: npx size-limit

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Test!SqlPwd123'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: EF migrations
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=taskflow;User Id=sa;Password=Test!SqlPwd123;TrustServerCertificate=true"
        run: dotnet ef database update --project TaskFlow.Infrastructure --startup-project TaskFlow.Api

      - name: Start API
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=taskflow;User Id=sa;Password=Test!SqlPwd123;TrustServerCertificate=true"
        run: |
          dotnet run --project TaskFlow.Api --no-launch-profile &
          for i in {1..30}; do curl -fs http://localhost:8080/health/ready && break; sleep 2; done

      - name: Playwright
        working-directory: ./web
        run: |
          npm ci
          npx playwright install --with-deps
          npm run test:e2e

      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: web/test-results/
