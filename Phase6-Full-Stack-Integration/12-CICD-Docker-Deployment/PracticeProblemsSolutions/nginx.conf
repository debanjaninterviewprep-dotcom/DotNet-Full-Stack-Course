server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — any unknown path returns index.html.
  location / {
    try_files $uri /index.html;
  }

  # Cache hashed assets aggressively.
  location ~* \.(js|css|png|jpg|jpeg|svg|woff2|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry HTML.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Security headers.
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 1024;
}
