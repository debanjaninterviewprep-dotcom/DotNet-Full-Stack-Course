# P6: Deploy — EF migrations bundle + slot swap on Azure App Service.
name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production    # gates with required reviewers + scoped secrets
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build EF migrations bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project TaskFlow.Infrastructure \
            --startup-project TaskFlow.Api \
            --self-contained -r linux-x64 \
            -o ./artifacts/efbundle

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply migrations to prod DB
        run: ./artifacts/efbundle --connection "${{ secrets.SQL_CONN }}"

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: taskflow-api
          slot-name: staging
          images: ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.event.workflow_run.head_branch }}

      - name: Smoke test staging
        run: |
          for i in {1..30}; do
            if curl -fs https://taskflow-api-staging.azurewebsites.net/health/ready; then
              echo "staging healthy"; exit 0
            fi
            sleep 5
          done
          echo "staging never went healthy"; exit 1

      - name: Swap staging -> production
        run: |
          az webapp deployment slot swap \
            -n taskflow-api -g taskflow-rg \
            --slot staging --target-slot production

      - name: Post-swap smoke
        run: |
          for i in {1..15}; do
            if curl -fs https://taskflow-api.azurewebsites.net/health/ready; then exit 0; fi
            sleep 4
          done
          echo "ROLLBACK: production unhealthy after swap"
          az webapp deployment slot swap \
            -n taskflow-api -g taskflow-rg \
            --slot production --target-slot staging
          exit 1
